
name: CI/CD Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - development

permissions:
  contents: read

jobs:
  build-android:
    name: Build Flutter APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Project
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Setup Supabase Environment
        env:
          SUPABASE_URL: ${{ https://fdhyjerswemvzwgthlsx.supabase.co }}
          SUPABASE_ANON_KEY: ${{ sb_publishable_6AU7yEA2thiXaDCNGi1fpA_JMUR2P2E }}
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_ANON_KEY"
          printf 'SUPABASE_URL=%s\n' "$SUPABASE_URL" > .env
          printf 'SUPABASE_ANON_KEY=%s\n' "$SUPABASE_ANON_KEY" >> .env

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: campus-ride-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
